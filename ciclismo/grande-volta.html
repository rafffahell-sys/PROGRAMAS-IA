<script>
(function () {
  try {
    var bruto = localStorage.getItem("ciclismo_v2");
    var salvo = bruto ? JSON.parse(bruto) : null;
    var tema = (salvo && (salvo.tema || salvo.temaAtivo)) || localStorage.getItem("ciclismo_temaAtivo");
    var mapa = { "red-dark": "roja", "blue-light": "dia", "green-dark": "amarela", amarela: "amarela", rosa: "rosa", roja: "roja", dia: "dia" };
    document.body.dataset.tema = mapa[tema] || "amarela";
  } catch (e) {
    document.body.dataset.tema = "amarela";
  }
})();
</script>
